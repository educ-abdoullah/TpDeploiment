name: CI-CD

on:
  push:
    branches:
      - main

jobs:

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt

      - name: Lancer les tests unitaires
        run: |
          python -m pytest Tests/test_unitaire.py -v


  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt

      - name: Demarrer Flask
        run: |
          python app.py &

      - name: Attendre le demarrage
        run: |
          sleep 10

      - name: Lancer les tests E2E
        run: |
          python -m pytest Tests/test_e2e.py -v


  build-push:
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - e2e-tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire image 
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/tpdeploiment:${{ github.sha }} .

      - name: Ajouter tag 
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USER }}/tpdeploiment:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USER }}/tpdeploiment:latest

      - name: Push image Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/tpdeploiment:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USER }}/tpdeploiment:latest


  deploy:
    runs-on: ubuntu-latest

    needs:
      - build-push

    steps:
      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deployer sur la VM
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        run: |
          sudo sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_IP" "
              cd /home/ubuntu/mra/tpdeploiment

              sudo docker pull $DOCKERHUB_USER/tpdeploiment:latest

              sudo docker rm -f mra-app || true

              sudo docker run -d \
                --name mra-app \
                --restart unless-stopped \
                -p 8087:8080 \
                $DOCKERHUB_USER/tpdeploiment:latest
            "

      - name: Verifier le deploiement
        env:
          SSH_IP: ${{ secrets.SSH_IP }}
        run: |
          sleep 10
          sudo curl --fail http://127.0.0.1:8080
